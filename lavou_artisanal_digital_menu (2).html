    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {

        body {

        .font-logo-script {

            font-style: italic;
            font-weight: 600;
        }

        /* Subtle Gold Line Pattern matching Lavou aesthetic */
        .lavou-pattern {
            background-color: #FAF6F0;
            background-image: radial-gradient(#C88A34 0.6px, transparent 0.6px), radial-gradient(#C88A34 0.6px, #FAF6F0 0.6px);

            background-position: 0 0, 12px 12px;
            background-opacity: 0.15;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Subtle Luxury Hover Animation */
        .lavou-card {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .lavou-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -6px rgba(42, 26, 20, 0.12);
        }

        /* Category Tab Active States */
        .cat-btn.active {
            background-color: #2A1A14;
            color: #E5BD78;
            border-color: #C88A34;
            box-shadow: 0 4px 12px rgba(42, 26, 20, 0.2);

            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            padding: 1px;

        }
        .veg-symbol::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #16a34a;
            border-radius: 50%;
        }

        .nonveg-symbol {
            border: 1.5px solid #dc2626;
            display: inline-flex;

            justify-content: center;
            width: 14px;
            height: 14px;
            padding: 1px;
            background: white;
        }
        .nonveg-symbol::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 3.5px solid transparent;
            border-right: 3.5px solid transparent;
            border-bottom: 7px solid #dc2626;
        }

        let activeCategory = 'all';
        let activeDiet = 'all';

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = menuData.filter(item => {
                const matchCat = (activeCategory === 'all' || item.category === activeCategory);
                const matchSearch = item.name.toLowerCase().includes(searchVal) || item.desc.toLowerCase().includes(searchVal);
                
                let matchDiet = true;
                if (activeDiet === 'veg') matchDiet = (item.diet === 'veg');
                if (activeDiet === 'egg') matchDiet = (item.diet === 'egg' || item.diet === 'nonveg');

                return matchCat && matchSearch && matchDiet;
            });

            document.getElementById('itemCounter').innerText = `${filtered.length} Items`;

            if (filtered.length === 0) {
                container.innerHTML = '';
                document.getElementById('noResults').classList.remove('hidden');
                return;
            }

            document.getElementById('noResults').classList.add('hidden');

            container.innerHTML = filtered.map(item => `
                <div class="lavou-card bg-white rounded-2xl overflow-hidden border border-lavou-gold/30 shadow-2xs flex flex-col justify-between group">
                    
                    <!-- Image Card with Zoom -->
                    <div class="relative overflow-hidden cursor-pointer" onclick="openLightbox('${item.id}')">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-44 object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                        
                        <!-- Dietary Badge -->
                        <div class="absolute top-3 left-3">
                            ${item.diet === 'veg' ? `
                                <span class="bg-white/95 text-emerald-800 text-[10px] px-2 py-0.5 rounded-md font-semibold shadow-xs flex items-center gap-1 border border-stone-200">
                                    <span class="veg-symbol"></span> Veg
                                </span>
                            ` : item.diet === 'nonveg' ? `
                                <span class="bg-white/95 text-rose-800 text-[10px] px-2 py-0.5 rounded-md font-semibold shadow-xs flex items-center gap-1 border border-stone-200">
                                    <span class="nonveg-symbol"></span> Non-Veg
                                </span>
                            ` : `
                                <span class="bg-white/95 text-amber-800 text-[10px] px-2 py-0.5 rounded-md font-semibold shadow-xs flex items-center gap-1 border border-stone-200">
                                    <span class="nonveg-symbol"></span> Contains Egg
                                </span>
                            `}
                        </div>

                        <div class="absolute inset-0 bg-lavou-dark/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <span class="bg-white text-lavou-dark text-[11px] font-tagline font-bold px-3 py-1 rounded-full shadow-md">
                                <i class="fa-solid fa-expand text-lavou-gold"></i> View Details
                            </span>
                        </div>
                    </div>

                    <!-- Item Details -->
                    <div class="p-4 flex-1 flex flex-col justify-between bg-white">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-1">
                                <h3 class="font-logo-script text-xl font-bold text-lavou-dark group-hover:text-lavou-gold transition leading-snug">
                                    ${item.name}
                                </h3>
                                <span class="font-tagline font-bold text-xs text-lavou-dark bg-lavou-goldBg border border-lavou-gold/30 px-2.5 py-0.5 rounded-full whitespace-nowrap">
                                    ${item.price}
                                </span>
                            </div>

                            <p class="text-stone-500 text-xs leading-relaxed line-clamp-2 mt-1">
                                ${item.desc}
                            </p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('bg-white', 'text-lavou-dark');
            });

            const activeTab = document.getElementById(`tab-${cat}`);
            if (activeTab) {
                activeTab.classList.add('active');
                activeTab.classList.remove('bg-white', 'text-lavou-dark');
            }

            const categoryTitles = {
                'all': 'All Artisanal Items',
                'donuts': '🍩 Brioche Donuts',
                'savories': '🥐 Savories',
                'cakes': '🍰 Cakes (500g / 1Kg)',
                'pastries': '🥧 Pastries (100g)',
                'cheesecakes': '🧀 Cheesecakes',
                'tarts': '🍪 Tarts, Cookies & Brownies',
                'teacakes': '☕ Classic Tea Cakes'
            };
            document.getElementById('categoryTitle').innerText = categoryTitles[cat] || 'Menu Items';
            renderMenu();
        }

        function setDiet(diet) {
            activeDiet = diet;
            document.querySelectorAll('.diet-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-lavou-dark', 'text-lavou-goldLight');
                btn.classList.add('text-lavou-dark');
            });
            const activeBtn = document.getElementById(`diet-${diet}`);
            if (activeBtn) {
                activeBtn.classList.add('active', 'bg-lavou-dark', 'text-lavou-goldLight');
            }
            renderMenu();
        }

        function filterItems() {
            renderMenu();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            setDiet('all');
            setCategory('all');
        }

        function openLightbox(id) {
            const item = menuData.find(i => i.id === id);
            if (!item) return;

            document.getElementById('lightboxImg').src = item.image;
            document.getElementById('lightboxTitle').innerText = item.name;
            document.getElementById('lightboxPrice').innerText = item.price;
            document.getElementById('lightboxDesc').innerText = item.desc;

            const badgeContainer = document.getElementById('lightboxBadge');
            badgeContainer.innerHTML = item.diet === 'veg' ? `
                <span class="bg-white/95 text-emerald-800 text-xs px-2.5 py-1 rounded-md font-semibold shadow-xs flex items-center gap-1 border border-stone-200">
                    <span class="veg-symbol"></span> 100% Vegetarian
                </span>
            ` : item.diet === 'nonveg' ? `
                <span class="bg-white/95 text-rose-800 text-xs px-2.5 py-1 rounded-md font-semibold shadow-xs flex items-center gap-1 border border-stone-200">
                    <span class="nonveg-symbol"></span> Non-Vegetarian
                </span>
            ` : `
                <span class="bg-white/95 text-amber-800 text-xs px-2.5 py-1 rounded-md font-semibold shadow-xs flex items-center gap-1 border border-stone-200">
                    <span class="nonveg-symbol"></span> Contains Egg
                </span>
            `;

            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        window.onload = function() {
            renderMenu();
        };
    </script>
